name: GetOudio
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  postGenCommand: |
    # Fix AppIcon.icon lastKnownFileType from folder to folder.iconcomposer.icon
    # This is needed because XcodeGen doesn't support Icon Composer file type directly
    PBXPROJ="GetOudio.xcodeproj/project.pbxproj"
    if [ -f "$PBXPROJ" ]; then
      sed -i '' 's/lastKnownFileType = folder; name = AppIcon.icon; path = GetOudio\/Resources\/AppIcon.icon/lastKnownFileType = folder.iconcomposer.icon; name = AppIcon.icon; path = GetOudio\/Resources\/AppIcon.icon/g' "$PBXPROJ"
    fi
settings:
  base:
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.3.1"
    CURRENT_PROJECT_VERSION: "8"
    DEVELOPMENT_TEAM: ZWNUJ64F36
    CODE_SIGN_STYLE: Automatic
configs:
  Debug: debug
  Release: release
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4
targets:
  GetOudioCore:
    type: framework
    platform: macOS
    sources:
      - path: GetOudioCore/Sources
    info:
      path: GetOudioCore/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shengjiacheng.GetOudioCore
        PRODUCT_NAME: GetOudioCore

  GetOudio:
    type: application
    platform: macOS
    sources:
      - path: GetOudio/App
      - path: GetOudio/Models
      - path: GetOudio/Views
      - path: GetOudio/Resources/AppIcon.icon
        type: folder
        buildPhase: resources
      - path: GetOudio/Resources/NCMFileIcon.icns
        buildPhase: resources
      - path: GetOudio/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: GetOudio/Resources/Documentation
        type: folder
        buildPhase: resources
      - path: GetOudio/Resources/LaunchAgents
        type: folder
        buildPhase: resources
      - path: GetOudio/Resources/ThirdParty/ffmpeg
        type: folder
        buildPhase: resources
      - path: GetOudio/Resources/ThirdParty/ncmdump
        type: folder
        buildPhase: resources
      - path: GetOudio/Resources/ThirdParty/apple-music-downloader
        type: folder
        buildPhase: resources
    dependencies:
      - target: GetOudioCore
      - package: Sparkle
        product: Sparkle
      - target: GetOudioBootstrapInstaller
        embed: false
        link: false
      - target: GetOudioAMRuntimeWorker
        embed: false
        link: false
      - target: GetOudioFinderExtension
        embed: true
      - target: GetOudioShareExtension
        embed: true
      - target: GetOudioRecordingWidget
        embed: true
    info:
      path: GetOudio/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        CFBundleIconName: AppIcon
        SUFeedURL: https://raw.githubusercontent.com/memomoonnnn/GetOudio/main/appcast.xml
        SUPublicEDKey: psHCoR2oe7hrdR+F6gAOUB6yQzi/ci+pC002hDKvYu8=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUEnableInstallerLauncherService: true
        ATSApplicationFontsPath: Fonts
        NSAppleEventsUsageDescription: Get Oudio 需要重启 Finder，以便新启用的 Finder Sync 菜单拓展生效。
        NSMicrophoneUsageDescription: Get Oudio 需要读取 Pro Tools Audio Bridge 的输入信号以录制 PCM 音频。
        CFBundleURLTypes:
          - CFBundleURLName: com.shengjiacheng.GetOudio
            CFBundleURLSchemes:
              - getoudio
        CFBundleDocumentTypes:
          - CFBundleTypeName: NCM File
            CFBundleTypeRole: Editor
            CFBundleTypeIconFile: NCMFileIcon.icns
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.shengjiacheng.getoudio.ncm
          - CFBundleTypeName: Audio File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - m4a
              - aac
              - mp3
              - alac
              - flac
              - wav
              - aiff
              - aif
              - ogg
              - opus
              - caf
            LSItemContentTypes:
              - public.audio
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.shengjiacheng.getoudio.ncm
            UTTypeDescription: NCM File
            UTTypeIconFile: NCMFileIcon.icns
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ncm
    entitlements:
      path: GetOudio/GetOudio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.automation.apple-events: true
        com.apple.security.temporary-exception.apple-events:
          - com.apple.finder
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.user-selected.executable: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.desktop.read-write: true
        com.apple.security.files.documents.read-write: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.movies.read-write: true
        com.apple.security.files.music.read-write: true
        com.apple.security.files.pictures.read-write: true
        com.apple.security.network.client: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
          - com.shengjiacheng.GetOudio.agent
          - com.shengjiacheng.GetOudio.runtime-worker
        com.apple.security.device.audio-input: true
    settings:
      base:
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: default
        ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT: YES
        ENABLE_APP_SANDBOX: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shengjiacheng.GetOudio
        PRODUCT_NAME: Get Oudio
    postBuildScripts:
      - name: Embed Background Helpers
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/GetOudioBootstrapInstaller.app/Contents/MacOS/GetOudioBootstrapInstaller"
          - "$(BUILT_PRODUCTS_DIR)/GetOudioAMRuntimeWorker.app/Contents/MacOS/GetOudioAMRuntimeWorker"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/GetOudioBootstrapInstaller.app/Contents/MacOS/GetOudioBootstrapInstaller"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/GetOudioAMRuntimeWorker.app/Contents/MacOS/GetOudioAMRuntimeWorker"
        script: |
          set -euo pipefail
          BOOTSTRAP_APP="$BUILT_PRODUCTS_DIR/GetOudioBootstrapInstaller.app"
          WORKER_APP="$BUILT_PRODUCTS_DIR/GetOudioAMRuntimeWorker.app"
          HELPERS_DIR="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          BOOTSTRAP_DEST="$HELPERS_DIR/GetOudioBootstrapInstaller.app"
          WORKER_DEST="$HELPERS_DIR/GetOudioAMRuntimeWorker.app"
          if [ ! -d "$BOOTSTRAP_APP" ]; then
            echo "missing Bootstrap Installer at $BOOTSTRAP_APP" >&2
            exit 1
          fi
          if [ ! -d "$WORKER_APP" ]; then
            echo "missing Apple Music Runtime Worker at $WORKER_APP" >&2
            exit 1
          fi
          rm -rf "$BOOTSTRAP_DEST" "$WORKER_DEST"
          mkdir -p "$HELPERS_DIR"
          ditto "$BOOTSTRAP_APP" "$BOOTSTRAP_DEST"
          ditto "$WORKER_APP" "$WORKER_DEST"

  GetOudioBootstrapInstaller:
    type: application
    platform: macOS
    sources:
      - path: GetOudioBootstrapInstaller/Sources
    info:
      path: GetOudioBootstrapInstaller/Info.plist
      properties:
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: com.shengjiacheng.GetOudio.BootstrapInstaller
            CFBundleURLSchemes:
              - getoudio-bootstrap
    settings:
      base:
        ENABLE_APP_SANDBOX: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.shengjiacheng.GetOudio.BootstrapInstaller
        PRODUCT_NAME: GetOudioBootstrapInstaller

  GetOudioAMRuntimeWorker:
    type: application
    platform: macOS
    sources:
      - path: GetOudioAMRuntimeWorker/Sources
    dependencies:
      - target: GetOudioCore
    info:
      path: GetOudioAMRuntimeWorker/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        CFBundleDisplayName: Get Oudio Apple Music Runtime Worker
    entitlements:
      path: GetOudioAMRuntimeWorker/GetOudioAMRuntimeWorker.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.virtualization: true
    settings:
      base:
        ENABLE_APP_SANDBOX: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.shengjiacheng.GetOudio.AMRuntimeWorker
        PRODUCT_NAME: GetOudioAMRuntimeWorker

  GetOudioRecordingWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: GetOudioRecordingWidget/Sources
    dependencies:
      - target: GetOudioCore
    info:
      path: GetOudioRecordingWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Get Oudio Recorder
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GetOudioRecordingWidget/GetOudioRecordingWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - com.shengjiacheng.GetOudio.agent
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_APP_SANDBOX: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shengjiacheng.GetOudio.RecordingWidget
        PRODUCT_NAME: GetOudioRecordingWidget

  GetOudioFinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: GetOudioFinderExtension/Sources
    dependencies:
      - target: GetOudioCore
    info:
      path: GetOudioFinderExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Get Oudio Finder Extension
        NSExtension:
          NSExtensionAttributes: {}
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    entitlements:
      path: GetOudioFinderExtension/GetOudioFinderExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - com.shengjiacheng.GetOudio.agent
    settings:
      base:
        ENABLE_APP_SANDBOX: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shengjiacheng.GetOudio.FinderExtension
        PRODUCT_NAME: GetOudioFinderExtension

  GetOudioShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: GetOudioShareExtension/Sources
      - path: GetOudioShareExtension/Resources
    dependencies:
      - target: GetOudioCore
    info:
      path: GetOudioShareExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Get Oudio
        CFBundleIconFile: icon
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationDictionaryVersion: 2
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 999
              NSExtensionActivationSupportsFileWithMaxCount: 999
              NSExtensionActivationSupportsImageWithMaxCount: 999
              NSExtensionActivationSupportsMovieWithMaxCount: 999
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareExtension
    entitlements:
      path: GetOudioShareExtension/GetOudioShareExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - com.shengjiacheng.GetOudio.agent
    settings:
      base:
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shengjiacheng.GetOudio.ShareExtension
        PRODUCT_NAME: GetOudioShareExtension

  GetOudioCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GetOudioCore/Tests
    dependencies:
      - target: GetOudioCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shengjiacheng.GetOudioCoreTests

schemes:
  GetOudioCoreTests:
    build:
      targets:
        GetOudioCore: all
        GetOudioCoreTests: all
    test:
      config: Debug
      targets:
        - GetOudioCoreTests

  GetOudio:
    build:
      targets:
        GetOudio: all
        GetOudioCore: all
        GetOudioAMRuntimeWorker: all
        GetOudioFinderExtension: all
        GetOudioShareExtension: all
        GetOudioRecordingWidget: all
    run:
      config: Debug
      executable: GetOudio
    test:
      config: Debug
      targets:
        - GetOudioCoreTests
